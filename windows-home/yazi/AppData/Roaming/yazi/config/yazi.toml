[mgr]
show_hidden = true

[opener]
edit = [
    { run = '${EDITOR:-nvim} "%s"', desc = "$EDITOR", block = true, for = "unix" },
    { run = 'nvim %s', block = true, desc = "nvim", for = "windows" },
]
open = [
    { run = 'xdg-open "%s1"', desc = "Open", for = "linux" },
    { run = 'open "%s"', desc = "Open", for = "macos" },
    { run = 'start "" "%s1"', orphan = true, desc = "Open", for = "windows" },
    { run = 'termux-open "%s1"', desc = "Open", for = "android" },
]
reveal = [
    { run = 'xdg-open "$(dirname "%s1")"', desc = "Reveal", for = "linux" },
    { run = 'open -R "%s1"', desc = "Reveal", for = "macos" },
    { run = 'explorer /select,"%s1"', orphan = true, desc = "Reveal", for = "windows" },
    { run = 'termux-open "$(dirname "%s1")"', desc = "Reveal", for = "android" },
    { run = '''clear; exiftool "%s1"; echo "Press enter to exit"; read _''', block = true, desc = "Show EXIF", for = "unix" },
]
extract = [
    { run = 'ya pub extract --list "%s"', desc = "Extract here", for = "unix" },
    { run = 'ya pub extract --list %s', desc = "Extract here", for = "windows" },
]
play = [
    { run = 'mpv --force-window "%s"', orphan = true, for = "unix" },
    { run = 'mpv --force-window %s', orphan = true, for = "windows" },
    { run = '''mediainfo "%s1"; echo "Press enter to exit"; read _''', block = true, desc = "Show media info", for = "unix" },
]

[open]
rules = [
    # Folder
    { mime = "folder/*", use = ["edit", "open", "reveal"] },
    # Text
    { mime = "text/*", use = ["edit", "reveal"] },
    # Image
    { mime = "image/*", use = ["open", "edit", "reveal"] },
    # Media
    { mime = "{audio,video}/*", use = ["play", "edit", "reveal"] },
    # Code
    { mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = ["edit", "reveal"] },
    # Archive
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = ["extract", "edit", "reveal"] },
    # Empty file
    { mime = "inode/empty", use = ["edit", "reveal"] },
    # Virtual file system
    { mime = "vfs/{absent,stale}", use = ["download", "edit", "reveal"] },
    # Trash
    { mime = "trash/**", use = ["open", "edit", "trash", "reveal"] },
    # Fallback
    { url = "*", use = ["open", "edit", "reveal"] },
]
